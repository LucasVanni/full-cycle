services:
  app: 
    restart: on-failure:5
    build:
      args:
        - NODE_VERSION=${NODE_VERSION:-22.11.0}
        - NODEMON_VERSION=${NODEMON_VERSION:-3.1.9}
      context: .
      dockerfile: dockerfile.dev
    volumes:
      - .:/home/node/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
